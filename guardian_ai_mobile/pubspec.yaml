name: guardian_ai_mobile
description: "Guardian - personal safety app for India: SOS alerts by SMS, live location, journey check-ins and nearby help."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  provider: ^6.1.5

  # Maps (OpenStreetMap - no API key required); location is native (LocationBridge.kt)
  flutter_map: ^8.2.2
  latlong2: ^0.10.1

  # Device & platform
  permission_handler: ^12.0.1
  sensors_plus: ^7.0.0
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # Networking (nearby places, live-map server)
  http: ^1.5.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # `flutter run` / `flutter build` use the full edition unless --flavor lite is given.
  default-flavor: full
